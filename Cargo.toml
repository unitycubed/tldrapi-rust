[package]
name = "tldrapi"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Official Rust SDK for TLDRapi — text summarization API"
license = "MIT"
homepage = "https://tldrapi-summarizer.p.rapidapi.com/"
repository = "https://github.com/unitycubed/tldrapi-rust"
readme = "README.md"
keywords = ["tldrapi", "summarization", "nlp", "ai", "rapidapi"]
categories = ["api-bindings"]

[dependencies]
# Deliberately tiny surface area. reqwest for HTTPS (rustls, no system
# libcurl dependency); serde + serde_json for typed request/response
# handling; thiserror for a clean error hierarchy.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
